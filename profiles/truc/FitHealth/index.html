<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitHealth – Chăm sóc sức khỏe và thể hình</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --bg2:#f1f8f4; --ink:#12263a; --ink2:#51657a; --line:#d9e5df;
  --green:#0f7b4f; --green-h:#0a6340; --on-green:#ffffff; --green-t:#e0f3ea;
  --blue:#1b6ca8; --blue-t:#e1eef9; --amber:#a86a0a; --amber-t:#fbf0d9;
  --red:#b3261e; --red-t:#fbe8e5; --focus:#1b6ca8;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-disp:"Bricolage Grotesque","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1a22; --bg2:#122630; --ink:#e8f1ee; --ink2:#a3b6b2; --line:#27414b;
    --green:#3fc08a; --green-h:#66d4a5; --on-green:#06231a; --green-t:#133a2c;
    --blue:#62b0ec; --blue-t:#12324a; --amber:#e6b44f; --amber-t:#3a2d0f;
    --red:#f08a82; --red-t:#3e1b19; --focus:#62b0ec; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1a22; --bg2:#122630; --ink:#e8f1ee; --ink2:#a3b6b2; --line:#27414b;
  --green:#3fc08a; --green-h:#66d4a5; --on-green:#06231a; --green-t:#133a2c;
  --blue:#62b0ec; --blue-t:#12324a; --amber:#e6b44f; --amber-t:#3a2d0f;
  --red:#f08a82; --red-t:#3e1b19; --focus:#62b0ec; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-disp);line-height:1.15;letter-spacing:-.015em;margin:0 0 .5em;font-weight:800}
h1{font-size:clamp(1.9rem,4.6vw,3.2rem);letter-spacing:-.025em}
h2{font-size:clamp(1.4rem,2.6vw,1.9rem)}
h3{font-size:1.15rem;font-weight:600}
p{margin:0 0 1em;max-width:68ch}
a{color:var(--blue)}
img,svg{max-width:100%}
.muted{color:var(--ink2)}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--green);color:var(--on-green);padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-disp);font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.logo svg{width:32px;height:32px}
.nav{display:flex;gap:4px;margin-left:12px;flex:1}
.nav a{color:var(--ink2);text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:500}
.nav a:hover{background:var(--bg2);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--green);background:var(--green-t)}
.acts{display:flex;gap:8px;align-items:center}
.burger{display:none}
@media (max-width:860px){
  .burger{display:inline-flex;margin-left:auto}
  .nav,.acts{display:none}
  .top.open .wrap{flex-wrap:wrap;padding-bottom:12px}
  .top.open .nav{display:flex;flex-direction:column;width:100%;margin:0}
  .top.open .acts{display:flex;width:100%}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--green);background:var(--green);color:var(--on-green);font:600 .95rem var(--f-body);padding:10px 18px;border-radius:10px;cursor:pointer;text-decoration:none;min-height:42px}
.btn:hover{background:var(--green-h);border-color:var(--green-h)}
.btn.sec{background:transparent;color:var(--green)}
.btn.sec:hover{background:var(--green-t)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--bg2)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red-t)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem;border-radius:8px}
.btn.lg{padding:13px 24px;font-size:1.02rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.fld label{font-weight:600;font-size:.92rem}
.fld small{color:var(--ink2)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px;width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--ink2)}
textarea{resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 14px}
.err{color:var(--red);margin:0 0 10px;font-weight:500}
.ok{color:var(--green);font-weight:500}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--bg2);color:var(--ink2);border:1px solid var(--line)}
.t-green{background:var(--green-t);color:var(--green);border-color:transparent}
.t-blue{background:var(--blue-t);color:var(--blue);border-color:transparent}
.t-amber{background:var(--amber-t);color:var(--amber);border-color:transparent}
.t-red{background:var(--red-t);color:var(--red);border-color:transparent}
.tags{display:flex;gap:6px;flex-wrap:wrap}

/* sections */
section.sec{padding:56px 0}
section.alt{background:var(--bg2)}
.shead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.shead h2{margin:0}
.pagehead{padding:36px 0 8px}
.pagehead p{color:var(--ink2)}

/* hero */
.hero{padding:48px 0 56px;border-bottom:1px solid var(--line)}
.hero-g{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.hero p.lead{font-size:1.15rem;color:var(--ink2)}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
@media (max-width:900px){.hero-g{grid-template-columns:1fr;gap:28px}}
.bmi-panel{border:1px solid var(--line);border-radius:16px;padding:24px;background:var(--bg)}
.bmi-panel h2{font-size:1.25rem}
.bmi-v{display:flex;align-items:center;gap:12px;margin:8px 0 0}
.bmi-v strong{font:800 2.6rem var(--f-disp);line-height:1}
.scale{display:flex;height:14px;border-radius:99px;overflow:hidden;position:relative;margin-top:20px}
.scale i{display:block;height:100%}
.s-blue{background:#5aa9e6}.s-green{background:#2fa56f}.s-amber{background:#e0a82e}.s-red{background:#d9622b}
.mk{position:absolute;top:-4px;width:6px;height:22px;background:var(--ink);border:2px solid var(--bg);border-radius:4px;transform:translateX(-50%);transition:left .35s ease}
.scale-l{position:relative;height:20px;font-size:.78rem;color:var(--ink2);margin-top:4px}
.scale-l span{position:absolute;transform:translateX(-50%)}
.scale-l span:first-child{transform:none}
.scale-l span:last-child{transform:translateX(-100%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fine{font-size:.85rem;color:var(--ink2);margin-top:12px}

/* tiles + cards */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.tile{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);transition:border-color .15s}
.tile:hover{border-color:var(--green)}
.tile .art{display:block;width:100%;height:auto}
.tile .tb{padding:12px 14px 14px}
.tile h3{margin:0 0 6px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.post{display:block;text-decoration:none;color:var(--ink);border-top:3px solid var(--green);padding-top:12px}
.post:nth-child(2){border-color:var(--blue)}
.post h3{margin-bottom:6px}
.post:hover h3{text-decoration:underline}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;counter-reset:s}
.steps li{counter-increment:s;padding-left:46px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font:800 1rem var(--f-disp)}
.band{background:var(--green);color:var(--on-green);border-radius:18px;padding:36px;display:flex;justify-content:space-between;gap:24px;align-items:center;flex-wrap:wrap}
.band h2{margin:0 0 6px}
.band p{margin:0}
.band .btn{background:var(--on-green);color:var(--green);border-color:var(--on-green)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 14px;border-radius:99px;font:500 .9rem var(--f-body);cursor:pointer}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin-top:8px}
@media (max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters>:first-child{grid-column:1/-1}}
.empty{border:1px dashed var(--line);border-radius:14px;padding:32px;text-align:center;color:var(--ink2)}

/* detail */
.detail{display:grid;grid-template-columns:1fr 1.1fr;gap:36px;padding:28px 0 56px}
@media (max-width:860px){.detail{grid-template-columns:1fr}}
.detail .art{border-radius:16px;width:100%;height:auto}
.crumb{font-size:.9rem;padding-top:24px}
.vidbox{margin-bottom:16px}
.vidframe{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line)}
.vidframe iframe,.vidframe video{position:absolute;inset:0;width:100%;height:100%;border:0}
.vidempty{display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--bg2);border:1px dashed var(--line);border-radius:16px;padding:20px}
.vidempty b{font-family:var(--f-disp);font-size:1.05rem}
.vidlinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.steps-ol{padding-left:22px}.steps-ol li{margin-bottom:10px}
.note{background:var(--amber-t);color:var(--ink);border-radius:10px;padding:12px 16px;font-size:.92rem}
.prose p{max-width:68ch;margin-bottom:1.1em}
.prose{font-size:1.04rem}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg2);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.ta{display:flex;gap:6px;flex-wrap:wrap}

/* shell */
.shell{display:grid;grid-template-columns:220px 1fr;gap:32px;padding:28px 20px 64px}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start}
.side a{text-decoration:none;color:var(--ink2);padding:9px 12px;border-radius:8px;font-weight:500}
.side a:hover{background:var(--bg2);color:var(--ink)}
.side a[aria-current="page"]{background:var(--green-t);color:var(--green)}
.side .gl{font-size:.82rem;color:var(--ink2);padding:10px 12px 4px}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;gap:16px}
  .side{flex-direction:row;overflow-x:auto;position:static;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .side a{white-space:nowrap}.side .gl{display:none}
}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:clamp(1.5rem,3vw,2.1rem);margin:0}
.pn{border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;background:var(--bg)}
.pn>h2{font-size:1.15rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font:800 1.8rem var(--f-disp);line-height:1.1}
.stat span{color:var(--ink2);font-size:.88rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--green)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink2);font-size:11px;font-family:var(--f-body)}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item.done .nm{text-decoration:line-through;color:var(--ink2)}
.plan-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.plan-h h3{margin:0}
.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.macro div{background:var(--bg2);border-radius:8px;padding:8px 10px;text-align:center}
.macro b{display:block;font-family:var(--f-disp);font-size:1.15rem}
.macro span{font-size:.78rem;color:var(--ink2)}
.check{list-style:none;padding:0;margin:0}
.check li{display:flex;gap:10px;padding:6px 0;align-items:center}
.check .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.8rem}
.check .on .dot{background:var(--green);border-color:var(--green);color:var(--on-green)}

/* auth */
.auth{max-width:440px;margin:40px auto 72px;padding:0 20px}
.auth .pn{padding:28px}
.demo{background:var(--blue-t);border-radius:10px;padding:12px 14px;font-size:.9rem;margin-bottom:18px}
.demo code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem}

/* dialog */
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--bg);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(8,18,24,.55)}
.mform{padding:24px}
.mform h2{font-size:1.25rem}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}

details.faq{border-bottom:1px solid var(--line);padding:12px 0}
details.faq summary{cursor:pointer;font-weight:600}
details.faq p{margin:8px 0 0;color:var(--ink2)}

footer{border-top:1px solid var(--line);background:var(--bg2);padding:32px 0 40px;margin-top:0}
footer .fg{display:flex;gap:32px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--ink2);text-decoration:none;margin-right:16px}
footer a:hover{color:var(--green)}

body{background:var(--bg);line-height:1.7}.wrap{max-width:1240px}.top .wrap{min-height:76px}.btn{border-radius:99px}.pn,.tile,.stat{box-shadow:0 8px 30px rgba(16,60,39,.04)}.tile{transition:transform .2s,box-shadow .2s}.tile:hover{transform:translateY(-5px);box-shadow:0 16px 36px rgba(16,60,39,.12)}.photo-art{height:210px;background-image:url('assets/activities.png');background-size:300% 200%;background-repeat:no-repeat}.detail .photo-art{height:380px;border-radius:24px}.featurehero{position:relative;background:#073326;color:#fff;border-radius:28px;overflow:hidden;margin:24px auto 0;min-height:500px}.hero-photo{position:absolute;inset:0;background:url('assets/banner.png') center/cover;opacity:.48}.featurehero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#062b21 0%,rgba(6,43,33,.88) 40%,transparent 80%)}.hero-copy{position:relative;z-index:1;padding:64px 48px;max-width:620px}.hero-copy h1{font-size:clamp(2.5rem,5.5vw,4.5rem);letter-spacing:-.05em}.hero-copy p{color:#d3e8dc}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:.75rem;font-weight:600}.hero-copy .btn{background:#c5f29e;border-color:#c5f29e;color:#173b26}.hero-copy .btn.sec{background:transparent;color:white;border-color:#769b89}.goalgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.goal-card{padding:28px;border:1px solid var(--line);border-radius:20px;background:var(--bg);text-align:left;color:var(--ink);cursor:pointer;font:inherit}.goal-card:hover,.goal-card.selected{border-color:var(--green);background:var(--green-t)}.goal-card b{display:block;font:800 1.4rem var(--f-disp);margin:14px 0}.goal-icon{font-size:2rem}.goal-summary{padding:20px 0;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.visual-panel{display:grid;grid-template-columns:.8fr 1.2fr;gap:32px;align-items:center;padding:32px;border-radius:24px;background:var(--bg2)}.muscle-map{height:380px;width:100%;max-width:300px;display:block;margin:auto}.muscle-map [data-muscle]{cursor:pointer;fill:#5fa88a;stroke:#f1f8f4;stroke-width:3;transition:fill .2s}.muscle-map [data-muscle]:hover,.muscle-map [data-muscle]:focus{fill:#d5b243;outline:none}.muscle-map [data-muscle].chosen{fill:#e5b845}.quickmetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.ring{--progress:0;display:grid;place-items:center;width:116px;height:116px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--progress)*1%),var(--line) 0);margin:12px auto}.ring:before{content:'';width:94px;height:94px;border-radius:50%;background:var(--bg);grid-area:1/1}.ring strong{position:relative;grid-area:1/1;font-size:1.25rem}.ringcard{text-align:center;padding:20px;border:1px solid var(--line);border-radius:20px}.timerface{font:800 4rem var(--f-disp);text-align:center;letter-spacing:-.04em;margin:20px 0}.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:20px 0}.daycard{padding:12px 8px;border:1px solid var(--line);border-radius:12px;font-size:.8rem;background:var(--bg2)}.daycard b{display:block;color:var(--green)}.numberpill{width:42px;height:42px;background:var(--green-t);border-radius:12px;display:grid;place-items:center;font-weight:800}.mealhero{height:240px;border-radius:18px;background-image:url('assets/activities.png');background-size:300% 200%;background-position:100% 100%;margin-bottom:18px}.tile .photo-art:after{content:'Khám phá ↗';position:relative;top:166px;left:14px;font-size:.75rem;background:white;color:#174632;border-radius:99px;padding:6px 12px}.sectionintro{max-width:600px;color:var(--ink2)}.post{border:1px solid var(--line);border-radius:18px;overflow:hidden;padding:0 0 18px}.post>h3,.post>p,.post>span,.post>small{margin-left:18px;margin-right:18px}.post .photo-art{height:170px;margin:0 0 16px}.post .photo-art:after{display:none}section.sec{padding:64px 0}.timeractions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
@media(max-width:760px){.hero-copy{padding:42px 24px}.featurehero{min-height:450px}.hero-photo{background-position:65% center}.goalgrid,.quickmetrics{grid-template-columns:1fr}.visual-panel{grid-template-columns:1fr;padding:24px}.weekgrid{grid-template-columns:repeat(2,1fr)}.detail .photo-art{height:270px}.featurehero{margin-top:14px}.nav a{font-size:.88rem}}

/* calo + ảnh */
.bar i.over{background:var(--amber)}
.calnum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}.calnum b{font:800 2.6rem var(--f-disp);letter-spacing:-.03em}
.calsplit{display:grid;gap:8px}.calrow{display:grid;grid-template-columns:92px 1fr 84px;gap:12px;align-items:center;font-size:.9rem}.calrow b{text-align:right;font-weight:600}
.calcard .macro{margin:14px 0 0}
.mealhero{background-image:url('assets/photos/meal.jpg');background-size:cover;background-position:center;height:320px;border-radius:24px}
#main .pn>.mealhero{height:170px;background-position:center 35%}

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>isoOf(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoOf(d)};
const vd=iso=>iso?String(iso).slice(0,10).split('-').reverse().join('/'):'';
const num=(v,dp=1)=>Number(v).toLocaleString('vi-VN',{maximumFractionDigits:dp});
const age=iso=>{if(!iso)return null;const b=new Date(iso+'T00:00:00'),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const opt=(arr,sel)=>arr.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>${esc(l)}</option>`}).join('');

const CATS=['Cardio','Sức mạnh','Cơ bụng','Giãn cơ','Yoga'];
const MUSCLES=['Toàn thân','Chân','Ngực','Lưng','Vai','Tay','Bụng'];
const DIFFS=['Dễ','Trung bình','Khó'];
const PLACES=['Tại nhà','Phòng gym','Ngoài trời'];
const MEALS=['Bữa sáng','Bữa trưa','Bữa tối','Bữa phụ'];
const ACTS=['Ít vận động','Vận động nhẹ','Vận động vừa','Vận động nhiều'];
const GOALS=['Giảm cân','Tăng cơ','Duy trì thể trạng'];
const FBST=['Mới','Đang xử lý','Đã phản hồi'];

/* ---------- storage (localStorage, with in-memory fallback) ---------- */
const KEY='fithealth_db_v1',SKEY='fithealth_session_v1';
let DB=null,sessionId=null;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function save(){lsSet(KEY,JSON.stringify(DB))}
async function hashPw(salt,pw){
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){let h=5381;for(const c of salt+':'+pw)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h.toString(16)}
}

async function seed(){
  const t=todayISO();
  const db={users:[],profiles:{},exercises:[],plans:[],foods:[],meals:[],healthLogs:[],bmi:[],articles:[],feedbacks:[],favorites:[]};

  const demo=await mk('demo@fithealth.vn','Demo@123','user');

  db.profiles[admin.id]={fullName:'Quản trị viên'};

  const ex=[
   ['Đi bộ nhanh','Cardio','Toàn thân','Không cần dụng cụ','Dễ','Ngoài trời',['Đứng thẳng, mắt nhìn phía trước, vai thả lỏng.','Bước nhanh hơn bình thường, vung tay tự nhiên. Bạn vẫn nói chuyện được nhưng hơi gấp.','Bắt đầu với 15–20 phút, tăng dần theo cảm giác của cơ thể.']],
   ['Nhảy dây','Cardio','Toàn thân','Dây nhảy','Trung bình','Tại nhà',['Cầm hai tay cầm ngang hông, khuỷu tay gần thân.','Xoay dây bằng cổ tay, nhảy thấp khoảng 2–3 cm, tiếp đất nhẹ bằng mũi bàn chân.','Nhảy 30 giây, nghỉ 30 giây, lặp lại 5–8 hiệp.']],
   ['Chạy bộ ngắt quãng','Cardio','Chân','Không cần dụng cụ','Khó','Ngoài trời',['Khởi động bằng đi bộ nhanh 5 phút.','Chạy 1 phút ở mức hơi gắng sức, rồi đi bộ 2 phút để hồi sức.','Lặp lại 5–6 lần, kết thúc bằng đi bộ chậm và giãn cơ chân.']],
   ['Squat','Sức mạnh','Chân','Không cần dụng cụ','Dễ','Tại nhà',['Đứng hai chân rộng bằng vai, mũi chân hơi mở ra ngoài.','Đẩy hông ra sau và hạ người như ngồi xuống ghế, giữ lưng thẳng, đầu gối cùng hướng với mũi chân.','Đẩy qua gót chân để đứng lên, thở ra khi đứng lên.']],
   ['Hít đất','Sức mạnh','Ngực','Không cần dụng cụ','Trung bình','Tại nhà',['Chống hai tay rộng hơn vai một chút, thân người thẳng từ đầu đến gót.','Hạ ngực gần sát sàn, khuỷu tay mở khoảng 45 độ so với thân.','Đẩy người lên về vị trí ban đầu. Nếu còn khó, tập với đầu gối chạm sàn.']],
   ['Deadlift tạ đòn','Sức mạnh','Lưng','Tạ đòn','Khó','Phòng gym',['Đứng hai chân rộng bằng hông, thanh đòn nằm trên giữa bàn chân.','Gập hông, nắm thanh đòn, giữ lưng thẳng và siết bụng.','Đẩy chân xuống sàn để đứng thẳng, giữ tạ sát chân, rồi hạ xuống có kiểm soát. Lần đầu nên tập với tạ nhẹ và có người hướng dẫn.']],

   ['Cuốn tay với tạ đơn','Sức mạnh','Tay','Tạ đơn','Dễ','Phòng gym',['Đứng thẳng, hai tay cầm tạ, khuỷu tay sát thân.','Gập khuỷu đưa tạ lên vai, không đung đưa người.','Hạ tạ chậm về vị trí ban đầu.']],
   ['Gập bụng','Cơ bụng','Bụng','Không cần dụng cụ','Dễ','Tại nhà',['Nằm ngửa, gập gối, bàn chân đặt trên sàn, tay đặt nhẹ trước ngực.','Siết bụng, nhấc vai khỏi sàn, không kéo cổ.','Hạ xuống chậm, thở ra khi nâng người lên.']],
   ['Plank','Cơ bụng','Bụng','Thảm tập','Trung bình','Tại nhà',['Chống hai khuỷu tay dưới vai, hai chân duỗi thẳng.','Siết bụng và mông, giữ thân thẳng, không võng lưng hay nhô mông.','Giữ 20–45 giây rồi nghỉ, lặp lại 3 hiệp.']],
   ['Giãn cơ đùi sau','Giãn cơ','Chân','Không cần dụng cụ','Dễ','Tại nhà',['Ngồi duỗi một chân, chân kia gập lại.','Từ từ gập người về phía bàn chân đang duỗi, giữ lưng thẳng.','Giữ 20–30 giây ở mức căng nhẹ, không đau, rồi đổi bên.']],
   ['Giãn vai và cổ','Giãn cơ','Vai','Không cần dụng cụ','Dễ','Tại nhà',['Ngồi hoặc đứng thẳng, vai thả lỏng.','Nghiêng đầu sang một bên, tay cùng bên đặt nhẹ lên đầu, không kéo mạnh.','Giữ 20 giây mỗi bên, sau đó kéo một tay ngang ngực và giữ 20 giây.']],

   ['Tư thế chiến binh II','Yoga','Chân','Thảm yoga','Trung bình','Tại nhà',['Đứng chân rộng khoảng một sải chân, xoay mũi chân phải ra ngoài 90 độ.','Gập gối phải đến khi đầu gối nằm trên cổ chân, hai tay dang ngang.','Nhìn qua tay phải, giữ 5 nhịp thở rồi đổi bên.']]
  ];
  ex.forEach((e,i)=>db.exercises.push({id:'e'+(i+1),name:e[0],cat:e[1],muscle:e[2],equip:e[3],diff:e[4],place:e[5],steps:e[6],active:true}));

  const fd=[
   ['Cơm trắng (đã nấu)',100,'g',130,2.7,28,0.3],['Ức gà luộc',100,'g',165,31,0,3.6],['Trứng gà luộc',100,'g',155,13,1.1,11],
   ['Chuối',100,'g',89,1.1,23,0.3],['Yến mạch khô',100,'g',389,16.9,66,6.9],['Sữa tươi nguyên kem',100,'ml',61,3.2,4.8,3.3],
   ['Khoai lang luộc',100,'g',76,1.4,18,0.1],['Bông cải xanh luộc',100,'g',35,2.4,7.2,0.4],['Đậu phụ',100,'g',76,8,1.9,4.8],
   ['Cá hồi nướng',100,'g',206,22,0,12],['Táo',100,'g',52,0.3,14,0.2],['Bơ',100,'g',160,2,8.5,14.7],['Bánh mì nguyên cám',100,'g',247,13,41,3.4]
  ];
  fd.forEach((f,i)=>db.foods.push({id:'f'+(i+1),name:f[0],refQty:f[1],unit:f[2],cal:f[3],protein:f[4],carbs:f[5],fat:f[6]}));

  const art=[
   ['150 phút mỗi tuần nghĩa là gì?','Kỹ thuật tập luyện','Nhiều người nghe đến mốc “150 phút mỗi tuần” nhưng không rõ cách áp dụng. Với người trưởng thành, WHO khuyến nghị 150 đến 300 phút hoạt động thể lực cường độ vừa mỗi tuần, hoặc 75 đến 150 phút cường độ mạnh, và nên có ít nhất hai buổi tập tăng cường cơ bắp.\n\nCường độ vừa nghĩa là bạn thở nhanh hơn bình thường nhưng vẫn nói chuyện được, ví dụ đi bộ nhanh hoặc đạp xe nhẹ. Bạn có thể chia nhỏ thành 30 phút, 5 ngày mỗi tuần.\n\nNếu mới bắt đầu, hãy đặt mục tiêu thấp hơn và tăng dần. Duy trì đều đặn quan trọng hơn một tuần tập thật nhiều. Nếu có bệnh nền hoặc đang đau, hãy hỏi bác sĩ trước khi tăng cường độ.','Tham khảo: WHO – Physical activity (fact sheet)','https://www.who.int/news-room/fact-sheets/detail/physical-activity'],
   ['BMI cho biết gì và không cho biết gì','Chỉ số cơ thể','BMI được tính bằng cân nặng (kg) chia cho bình phương chiều cao (m). Đây là cách sàng lọc nhanh, dễ tính, và được dùng rộng rãi để phân nhóm thiếu cân, bình thường, thừa cân và béo phì.\n\nTuy nhiên BMI không phân biệt khối cơ và khối mỡ, không cho biết mỡ tập trung ở đâu, và không thay thế việc khám sức khỏe. Một người tập tạ lâu năm có thể có BMI cao nhưng tỷ lệ mỡ thấp. Ngưỡng phân loại cũng có thể khác với người châu Á.\n\nHãy dùng BMI như một con số tham khảo, và theo dõi thêm cân nặng theo thời gian, vòng eo, mức năng lượng và giấc ngủ.','Tham khảo: WHO – Obesity and overweight (fact sheet)','https://www.who.int/news-room/fact-sheets/detail/obesity-and-overweight'],
   ['Ngủ đủ giấc giúp việc tập luyện ra sao','Giấc ngủ','Cơ thể phục hồi sau buổi tập chủ yếu khi bạn nghỉ ngơi. Người trưởng thành thường được khuyến nghị ngủ từ 7 giờ trở lên mỗi đêm, dù nhu cầu mỗi người có khác nhau.\n\nKhi ngủ thiếu, bạn dễ mệt hơn, khó tập trung và thấy buổi tập nặng hơn bình thường. Hãy thử đi ngủ và thức dậy vào giờ cố định, hạn chế màn hình trước khi ngủ.\n\nTrong mục Theo dõi sức khỏe, bạn có thể ghi số giờ ngủ mỗi ngày để xem mối liên hệ với cảm giác khi tập.','Tham khảo: khuyến nghị về thời lượng ngủ của người trưởng thành (CDC, Hoa Kỳ)',''],
   ['Cách đọc bảng dinh dưỡng và tính khẩu phần','Dinh dưỡng','Mỗi thực phẩm trong FitHealth có một lượng tham chiếu, ví dụ 100 g. Năng lượng và các chất dinh dưỡng được ghi cho đúng lượng đó.\n\nĐể tính cho khẩu phần thực tế, lấy lượng bạn ăn chia cho lượng tham chiếu rồi nhân với giá trị trong bảng. Ví dụ ức gà luộc có 165 kcal trên 100 g, nếu bạn ăn 150 g thì được 165 × 150 ÷ 100 = 247,5 kcal.\n\nGiá trị trong bản demo là số gần đúng. Khi dùng cho mục đích thật, hãy đối chiếu với bảng thành phần thực phẩm hoặc nhãn sản phẩm.','Bài hướng dẫn cách tính theo tỷ lệ; số liệu thực phẩm trong demo cần đối chiếu nguồn chính thức.',''],
   ['Ghi nhật ký nước uống: thói quen nhỏ, dễ duy trì','Thói quen sinh hoạt','Lượng nước cần thiết khác nhau tùy cân nặng, thời tiết và mức vận động, nên không có một con số đúng cho mọi người. Điều quan trọng là bạn nhận ra mình thường uống nhiều hay ít.\n\nHãy đặt một chai nước ở nơi dễ thấy và ghi lại mỗi lần uống. Sau vài ngày bạn sẽ thấy khung giờ nào hay quên uống. Màu nước tiểu vàng nhạt thường là dấu hiệu bạn đang uống khá đủ.\n\nNếu bác sĩ đã dặn bạn hạn chế hoặc tăng lượng nước vì lý do sức khỏe, hãy làm theo chỉ dẫn đó.','Bài viết mẫu cho bản demo; cần bổ sung nguồn tham khảo khi dùng dữ liệu thật.','']
  ];
  art.forEach((a,i)=>db.articles.push({id:'a'+(i+1),title:a[0],category:a[1],content:a[2],author:'Ban biên tập FitHealth',source:a[3],sourceUrl:a[4],publishedAt:addDays(t,-(i*4+1)),status:'Đã xuất bản',sample:true}));

  const W=[62.4,62.2,62.3,62.0,61.9,61.9,61.6,61.7,61.4,61.3,61.2,61.0,61.1,60.8];

const bmiOf=(h,w)=>w/((h/100)**2);

const bmiErr=(h,w)=>{
  if(!(h>0)||!(w>0))return'Nhập chiều cao và cân nặng lớn hơn 0.';
  if(h<100||h>250)return'Chiều cao cần nằm trong khoảng 100–250 cm.';
  if(w<20||w>300)return'Cân nặng cần nằm trong khoảng 20–300 kg.';
  return null;
};
function bmiScale(p){
  return `<div class="scale" aria-hidden="true"><i class="s-blue" style="width:14%"></i><i class="s-green" style="width:26%"></i><i class="s-amber" style="width:20%"></i><i class="s-red" style="width:40%"></i><b class="mk" id="${p}mk" style="left:0;display:none"></b></div>
  <div class="scale-l" aria-hidden="true"><span style="left:0">15</span><span style="left:14%">18,5</span><span style="left:40%">25</span><span style="left:60%">30</span><span style="left:100%">40</span></div>`;
}
function bmiBox(p,h,w){
  return `<div class="row">
    <div class="fld"><label for="${p}h">Chiều cao (cm)</label><input id="${p}h" type="number" inputmode="decimal" step="any" min="0" value="${h||''}" placeholder="Ví dụ: 165"></div>
    <div class="fld"><label for="${p}w">Cân nặng (kg)</label><input id="${p}w" type="number" inputmode="decimal" step="any" min="0" value="${w||''}" placeholder="Ví dụ: 58"></div></div>
    <div id="${p}r" aria-live="polite"></div>${bmiScale(p)}`;
}
function updBmi(p){
  const hi=$('#'+p+'h'),wi=$('#'+p+'w'),r=$('#'+p+'r'),mk=$('#'+p+'mk');
  if(!hi.value&&!wi.value){r.innerHTML='<p class="muted" style="margin:0">Nhập chiều cao và cân nặng để xem kết quả.</p>';mk.style.display='none';return null}
  const h=parseFloat(hi.value),w=parseFloat(wi.value),e=bmiErr(h,w);
  if(e){r.innerHTML=`<p class="err" style="margin:0">${e}</p>`;mk.style.display='none';return null}
  const b=bmiOf(h,w),c=bmiCat(b);

  r.innerHTML=`<p class="bmi-v"><strong>${num(b,1)}</strong><span class="tag t-${c[1]}">${c[0]}</span></p>`;
  return{h,w,b};
}

function lineChart(pts,o={}){
  if(pts.length<2)return'<p class="muted">Cần ít nhất 2 lần ghi cân nặng để vẽ biểu đồ.</p>';
  const W=640,H=240,L=46,R=16,T=16,B=30,ys=pts.map(p=>p.y);if(o.target)ys.push(o.target);
  let mn=Math.min(...ys),mx=Math.max(...ys);const pd=(mx-mn)*.18||1;mn-=pd;mx+=pd;
  const X=i=>L+(W-L-R)*(i/(pts.length-1)),Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let g='';for(let k=0;k<4;k++){const v=mn+(mx-mn)*k/3,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${num(v,1)}</text>`}
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join('');
  const dots=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" fill="var(--green)"><title>${esc(p.x)}: ${num(p.y,1)}</title></circle>`).join('');
  const tg=o.target?`<line x1="${L}" x2="${W-R}" y1="${Y(o.target)}" y2="${Y(o.target)}" stroke="var(--blue)" stroke-dasharray="6 5" stroke-width="2"/><text x="${W-R}" y="${Y(o.target)-6}" text-anchor="end" style="fill:var(--blue)">Mục tiêu ${num(o.target,1)}</text>`:'';
  const mid=Math.floor((pts.length-1)/2);
  const xl=[0,mid,pts.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${X(i)}" y="${H-8}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${esc(pts[i].x)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ cân nặng theo thời gian, từ ${num(pts[0].y,1)} đến ${num(pts[pts.length-1].y,1)} ${o.unit||''}">${g}${tg}<path d="${d}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}
function barChart(data,label){
  const W=640,H=220,L=36,R=10,T=14,B=30,mx=Math.max(1,...data.map(d=>d.v)),bw=(W-L-R)/data.length;
  let g='';for(let k=0;k<=2;k++){const v=Math.round(mx*k/2),y=T+(H-T-B)*(1-k/2);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${v}</text>`}
  const bars=data.map((d,i)=>{const h=(H-T-B)*d.v/mx,x=L+i*bw+bw*.2;return `<rect x="${x}" y="${H-B-h}" width="${bw*.6}" height="${h}" rx="4" fill="var(--blue)"><title>${esc(d.l)}: ${d.v}</title></rect><text x="${x+bw*.3}" y="${H-10}" text-anchor="middle">${esc(d.l)}</text>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}${bars}</svg>`;
}

/* nutrition */
const NU={q:''};
function nuDraw(){
  const q=NU.q.trim().toLowerCase(),l=DB.foods.filter(f=>!q||f.name.toLowerCase().includes(q));
  $('#nures').innerHTML=l.length?`<div class="scroll"><table><thead><tr><th>Thực phẩm</th><th>Khẩu phần tham chiếu</th><th class="n">Năng lượng (kcal)</th><th class="n">Protein (g)</th><th class="n">Carbohydrate (g)</th><th class="n">Chất béo (g)</th></tr></thead><tbody>${l.map(f=>`<tr><td>${esc(f.name)}</td><td>${num(f.refQty,0)} ${esc(f.unit)}</td><td class="n">${num(f.cal,0)}</td><td class="n">${num(f.protein)}</td><td class="n">${num(f.carbs)}</td><td class="n">${num(f.fat)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Không tìm thấy thực phẩm nào khớp với từ khóa.</div>';
}
function calcFood(){
  const f=foodOf($('#cf').value),q=parseFloat($('#cq').value),r=$('#cr');
  if(!f)return;$('#cu').textContent=f.unit;
  if(!(q>0)){r.innerHTML='<p class="muted">Nhập lượng lớn hơn 0 để tính.</p>';return}
  const v=foodVals(f,q);
  r.innerHTML=`<div class="macro"><div><b>${num(v.cal,0)}</b><span>kcal</span></div><div><b>${num(v.protein)}</b><span>Protein (g)</span></div><div><b>${num(v.carbs)}</b><span>Carb (g)</span></div><div><b>${num(v.fat)}</b><span>Chất béo (g)</span></div></div>`;
}
function calTarget(u){
  if(!u)return null;const p=prof(u.id),lw=latestW(u.id),a=age(p.birthDate);
  if(!p.heightCm||!lw||a==null||a<18||!p.gender)return null;
  const bmr=10*lw.weight+6.25*p.heightCm-5*a+(p.gender==='Nam'?5:p.gender==='Nữ'?-161:-78);
  const f={'Ít vận động':1.2,'Vận động nhẹ':1.375,'Vận động vừa':1.55,'Vận động nhiều':1.725}[p.activity]||1.2;
  const tdee=bmr*f,adj=p.goal==='Giảm cân'?-400:p.goal==='Tăng cơ'?250:0;
  return{tdee:Math.round(tdee),target:Math.round(Math.max(tdee+adj,1200)),goal:p.goal||''};
}
function calBar(kcal,g){
  if(!g)return'';const pct=Math.round(kcal/g.target*100),w=Math.min(pct,100),left=g.target-kcal;
  return `<div class="bar" role="progressbar" aria-valuenow="${w}" aria-valuemin="0" aria-valuemax="100" aria-label="Tiến độ calo trong ngày"><i class="${pct>100?'over':''}" style="width:${w}%"></i></div>
  <p class="fine">Mục tiêu tham khảo khoảng <b>${num(g.target,0)} kcal/ngày</b> (nhu cầu ước tính ${num(g.tdee,0)} kcal${g.goal?`, điều chỉnh theo mục tiêu “${esc(g.goal)}”`:''}). ${left>=0?`Còn khoảng <b>${num(left,0)} kcal</b>.`:`Đã vượt khoảng <b>${num(-left,0)} kcal</b>.`} Đây chỉ là ước tính (công thức Mifflin-St Jeor), không thay thế tư vấn của chuyên gia dinh dưỡng.</p>`;
}
function macroBox(t){return `<div class="macro"><div><b>${num(t.cal,0)}</b><span>kcal</span></div><div><b>${num(t.protein)}</b><span>Protein (g)</span></div><div><b>${num(t.carbs)}</b><span>Carbohydrate (g)</span></div><div><b>${num(t.fat)}</b><span>Chất béo (g)</span></div></div>`}
function calCard(tot,day){
  const u=me(),g=calTarget(u);
  const rows=MEALS.map(t=>{const m=day.find(x=>x.type===t),sm=sumItems(m?m.items:[]),w=tot.cal>0?Math.round(sm.cal/tot.cal*100):0;
    return `<div class="calrow"><span>${t}</span><div class="bar" aria-hidden="true"><i style="width:${w}%"></i></div><b>${num(sm.cal,0)} kcal</b></div>`}).join('');
  return `<div class="pn calcard"><h2>Calo ngày ${vd(MD)}</h2>
  <div class="calnum"><b>${num(tot.cal,0)}</b><span class="muted">kcal đã ăn</span></div>
  ${g?calBar(tot.cal,g):`<p class="fine">Cập nhật chiều cao, ngày sinh, giới tính, mức vận động và ghi cân nặng để xem mục tiêu calo tham khảo. <a href="#/tai-khoan/ho-so">Mở hồ sơ</a></p>`}
  ${macroBox(tot)}
  <h3 style="margin:18px 0 6px;font-size:1rem">Calo theo từng bữa</h3><div class="calsplit">${rows}</div>
  <p class="fine">Tổng được cộng từ lượng thực phẩm bạn nhập, theo tỷ lệ với khẩu phần tham chiếu.</p></div>`;
}
const DAY=[];
function dayDraw(){
  const r=$('#dayres');if(!r)return;
  const tot=sumItems(DAY),u=me(),isU=u&&u.role==='user',g=isU?calTarget(u):null;
  if(!DAY.length){r.innerHTML='<div class="empty">Chưa có món nào. Chọn bữa, thực phẩm và lượng ăn ở trên rồi bấm “Thêm vào ngày”.</div>';return}
  const groups=MEALS.map(m=>{const its=DAY.map((it,i)=>({...it,i})).filter(it=>it.meal===m);if(!its.length)return'';const sm=sumItems(its);
    return `<h3 style="margin:16px 0 2px;font-size:1rem">${m} · ${num(sm.cal,0)} kcal</h3>`+its.map(it=>{const f=foodOf(it.foodId),v=f?foodVals(f,it.qty):{cal:0};
      return `<div class="item"><div>${esc(f?f.name:'Thực phẩm đã bị xóa')} · ${num(it.qty,0)} ${f?esc(f.unit):''}<br><small class="muted">${num(v.cal,0)} kcal</small></div><button class="btn ghost sm" aria-label="Xóa món khỏi ngày" onclick="App.dayDel(${it.i})">Xóa</button></div>`}).join('')}).join('');
  r.innerHTML=`<div class="calnum"><b>${num(tot.cal,0)}</b><span class="muted">kcal trong ngày hôm nay</span></div>${calBar(tot.cal,g)}${macroBox(tot)}${groups}
  <div class="ta" style="margin-top:16px">${isU?'<button class="btn" onclick="App.daySave()">Lưu vào nhật ký hôm nay</button>':'<a class="btn" href="#/dang-nhap">Đăng nhập để lưu và xem mục tiêu calo</a>'}<button class="btn ghost" onclick="App.dayClear()">Xóa tất cả</button></div>`;
}

    <div class="stat"><b>${num(tm.cal,0)}</b><span>kcal đã ghi hôm nay${(()=>{const g=calTarget(u);return g?' · mục tiêu ~'+num(g.target,0):''})()}</span></div>
  </div>
  <div class="two"><div class="pn"><h2>Cân nặng 14 ngày gần đây</h2>${lineChart(logs.map(l=>({x:vd(l.date).slice(0,5),y:l.weight})),{target:p.targetWeight,unit:'kg'})}</div>
  <div><div class="pn"><h2>Buổi tập tiếp theo</h2>${next?`<p style="margin:0 0 4px"><strong>${esc(next.name)}</strong></p><p class="muted" style="margin:0 0 12px">${vd(next.date)} · ${next.items.length} bài · ${planStatus(next)}</p><a class="btn sec sm" href="#/tai-khoan/lich-tap">Mở lịch tập</a>`:`<p class="muted">Chưa có lịch sắp tới.</p><a class="btn sm" href="#/tai-khoan/lich-tap">Tạo lịch tập</a>`}</div>
  <div class="pn"><h2>Bắt đầu theo dõi</h2><ul class="check">${steps.map(s=>`<li class="${s[1]?'on':''}"><span class="dot" aria-hidden="true">${s[1]?'✓':''}</span><a href="#${s[2]}">${s[0]}</a><span class="muted" style="font-size:.85rem">${s[1]?'(đã xong)':''}</span></li>`).join('')}</ul></div></div></div>

function uPlans(){

function uHealth(){
  const u=me(),p=prof(u.id),logs=myLogs(u.id),wl=logs.filter(l=>l.weight>0),t=todayISO(),tl=logs.find(l=>l.date===t)||{};
  const start=wl[0],cur=wl[wl.length-1];let prog='';

    const pc=Math.max(0,Math.min(1,(cur.weight-start.weight)/(p.targetWeight-start.weight)));
    prog=`<div class="pn"><h2>Tiến độ so với mục tiêu</h2><p style="margin:0 0 8px">Từ ${num(start.weight,1)} kg (${vd(start.date)}) đến ${num(cur.weight,1)} kg hiện tại. Mục tiêu: ${num(p.targetWeight,1)} kg.</p><div class="bar" role="progressbar" aria-valuenow="${Math.round(pc*100)}" aria-valuemin="0" aria-valuemax="100" aria-label="Tiến độ đến mục tiêu"><i style="width:${pc*100}%"></i></div><p class="fine">Đã đi được khoảng ${Math.round(pc*100)}% quãng đường đến mục tiêu.</p></div>`;
  }else if(!p.targetWeight)prog='<div class="pn"><p class="muted" style="margin:0">Đặt cân nặng mục tiêu trong <a href="#/tai-khoan/ho-so">Hồ sơ</a> để xem tiến độ.</p></div>';

  <div class="pn"><h2>Biểu đồ cân nặng</h2>${lineChart(wl.map(l=>({x:vd(l.date).slice(0,5),y:l.weight})),{target:p.targetWeight,unit:'kg'})}</div></div>
  ${prog}
  <div class="pn"><h2>Lịch sử</h2>${logs.length?`<div class="scroll"><table><thead><tr><th>Ngày</th><th class="n">Cân nặng (kg)</th><th class="n">Nước (ml)</th><th class="n">Ngủ (giờ)</th><th>Ghi chú</th><th></th></tr></thead><tbody>${[...logs].reverse().map(l=>`<tr><td>${vd(l.date)}</td><td class="n">${l.weight?num(l.weight,1):'—'}</td><td class="n">${l.water?num(l.water,0):'—'}</td><td class="n">${l.sleep?num(l.sleep,1):'—'}</td><td>${esc(l.notes)}</td><td><button class="btn danger sm" onclick="App.delHealth('${l.id}')">Xóa</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có ghi nhận nào. Nhập cân nặng, nước uống hoặc giấc ngủ ở trên.</div>'}</div>`);

/* ---------- router ---------- */
const R=[
 ['/',viewHome],['/bai-tap',viewExercises],['/bai-tap/:id',viewExercise],['/dinh-duong',viewNutrition],['/kien-thuc',viewArticles],['/kien-thuc/:id',viewArticle],['/lien-he',viewContact],
 ['/dang-nhap',viewLogin,'guest'],['/dang-ky',viewRegister,'guest'],
 ['/tai-khoan',uOverview,'user'],['/tai-khoan/ho-so',uProfile,'user'],['/tai-khoan/bmi',uBmi,'user'],['/tai-khoan/lich-tap',uPlans,'user'],['/tai-khoan/an-uong',uMeals,'user'],['/tai-khoan/theo-doi',uHealth,'user'],['/tai-khoan/gop-y',uFeedback,'user'],
 ['/quan-tri',aOverview,'admin'],['/quan-tri/tai-khoan',aUsers,'admin'],['/quan-tri/bai-tap',aExercises,'admin'],['/quan-tri/thuc-pham',aFoods,'admin'],['/quan-tri/bai-viet',aArticles,'admin'],['/quan-tri/gop-y',aFeedback,'admin']
];
let keepScroll=false;
function route(){
  const path=(location.hash.slice(1)||'/').split('?')[0].replace(/\/$/,'')||'/';
  let hit=null;
  for(const [p,v,acc] of R){const m=path.match(new RegExp('^'+p.replace(/:\w+/g,'([\\w-]+)')+'$'));if(m){hit={v,acc,args:m.slice(1)};break}}
  const u=me();
  if(hit){
    if(hit.acc==='guest'&&u)return go(u.role==='admin'?'/quan-tri':'/tai-khoan');
    if(hit.acc==='user'){if(!u){afterLogin=path;return go('/dang-nhap')}if(u.role==='admin')return go('/quan-tri')}
    if(hit.acc==='admin'){if(!u){afterLogin=path;return go('/dang-nhap')}if(u.role!=='admin'){toast('Bạn không có quyền vào khu quản trị.');return go('/tai-khoan')}}
  }
  post=null;
  const y=window.scrollY;
  $('#main').innerHTML=hit?hit.v(...hit.args):view404();
  drawHeader(path);
  $('#top').classList.remove('open');
  enhanceView(path);
  if(post)post();
  const h=$('#main h1');document.title=(h?h.textContent+' – ':'')+'FitHealth';
  if(keepScroll){window.scrollTo(0,y)}else{window.scrollTo(0,0)}
  keepScroll=false;
}
function rerender(){keepScroll=true;route()}
window.addEventListener('hashchange',route);

let workout=null,timerId=null;

function workoutView(){const d=$('#dlg'),p=DB.plans.find(p=>p.id===workout.pid),i=p.items.find(i=>i.id===workout.iid),e=exOf(i.exId);d.innerHTML=`<div class="mform"><h2 id="dlgt">${esc(e?e.name:'Buổi tập')}</h2>${e?art(e.cat):''}<p class="fine">${i.sets} hiệp · ${i.reps?i.reps+' lần/hiệp':i.duration+' phút'} • Đồng hồ ghi thời gian phiên tập</p><div id="clock" class="timerface" role="timer">00:00</div><div class="timeractions"><button class="btn" id="pausebtn" onclick="App.toggleWorkout()">${workout.started?'Tạm dừng':'Tiếp tục'}</button><button class="btn sec" onclick="App.finishWorkout()">Lưu hoàn thành bài</button><button class="btn ghost" onclick="App.cancelWorkout()">Kết thúc phiên</button></div><p class="fine">Ảnh minh họa nhóm bài tập. Xem hướng dẫn động tác trước khi thực hiện. ${e?`<a href="#/bai-tap/${e.id}" target="_blank" rel="noopener">Xem video hướng dẫn (mở tab mới)</a>`:''}</p></div>`;tickTimer();if(!d.open)d.showModal()}
App.beginWorkout=pid=>{const p=DB.plans.find(p=>p.id===pid&&p.userId===me().id),i=p&&p.items.find(i=>!i.done);if(!i){toast('Thêm bài tập chưa hoàn thành trước khi bắt đầu.');return}stopTimer();workout={pid,iid:i.id,elapsed:0,started:Date.now()};workoutView();timerId=setInterval(tickTimer,250)};
App.toggleWorkout=()=>{if(!workout)return;if(workout.started){workout.elapsed+=Date.now()-workout.started;workout.started=null}else workout.started=Date.now();$('#pausebtn').textContent=workout.started?'Tạm dừng':'Tiếp tục';tickTimer()};
App.cancelWorkout=()=>{stopTimer();workout=null;$('#dlg').close();toast('Đã kết thúc phiên. Bài tập chưa được đánh dấu hoàn thành.')};
App.finishWorkout=()=>{if(!workout)return;const p=DB.plans.find(p=>p.id===workout.pid&&p.userId===me().id),i=p&&p.items.find(i=>i.id===workout.iid);if(!i)return;const seconds=Math.floor((workout.elapsed+(workout.started?Date.now()-workout.started:0))/1000);const pid=workout.pid,iid=workout.iid;stopTimer();workout=null;modal('Xác nhận kết quả thực tế',flds([{name:'sets',label:'Số hiệp đã tập',type:'number',value:i.sets,min:1},{name:'reps',label:'Số lần mỗi hiệp',type:'number',value:i.reps,min:0},{name:'duration',label:'Phút tập thực tế (có thể chỉnh)',type:'number',value:Math.round(seconds/60*10)/10,min:0},{name:'notes',label:'Ghi chú',type:'textarea'}]),d=>{const sets=Number(d.sets),reps=Number(d.reps),duration=Number(d.duration);if(!Number.isFinite(sets)||sets<1||!Number.isFinite(reps)||reps<0||!Number.isFinite(duration)||duration<0)return'Kiểm tra số liệu thực tế.';if(!reps&&!duration)return'Nhập số lần hoặc thời gian thực tế.';i.done=true;i.completedOn=todayISO();i.actual={sets,reps,duration,notes:d.notes.trim()};save();toast('Đã lưu kết quả thực tế.');return true},{submit:'Xác nhận hoàn thành'})};
$('#dlg').addEventListener('close',()=>{stopTimer();workout=null});$('#dlg').addEventListener('cancel',()=>{stopTimer();workout=null});window.addEventListener('hashchange',()=>{stopTimer();workout=null;if($('#dlg').open)$('#dlg').close()});
function reportView(){const u=me(),t=todayISO(),start=addDays(t,-6),plans=DB.plans.filter(p=>p.userId===u.id),items=plans.flatMap(p=>p.items).filter(i=>i.done&&i.completedOn>=start&&i.completedOn<=t),logs=myLogs(u.id).filter(l=>l.date>=start&&l.date<=t),minutes=items.reduce((n,i)=>n+(i.actual?.duration||0),0);return shell('user','/tai-khoan/bao-cao','Bảy ngày của bạn',`<p class="muted">${vd(start)} – ${vd(t)} · Dựa trên dữ liệu đã ghi</p><div class="stats"><div class="stat"><b>${items.length}</b><span>Bài tập hoàn thành</span></div><div class="stat"><b>${num(minutes)}</b><span>Phút tập thực tế đã ghi</span></div><div class="stat"><b>${logs.length}/7</b><span>Ngày có nhật ký sức khỏe</span></div></div><div class="pn"><h2>Hoạt động trong tuần</h2>${barChart(Array.from({length:7},(_,k)=>{const d=addDays(start,k);return{l:vd(d).slice(0,5),v:items.filter(i=>i.completedOn===d).length}}),'Số bài tập hoàn thành theo ngày')}</div><div class="pn"><h2>Cân nặng đã ghi</h2>${lineChart(logs.filter(l=>l.weight>0).map(l=>({x:vd(l.date),y:l.weight})),{unit:'kg'})}</div><p class="fine">Ngày thiếu dữ liệu không có nghĩa là bạn không vận động. Báo cáo không đánh giá tình trạng sức khỏe.</p><button class="btn" onclick="App.exportReport()">Tải nhật ký tuần (CSV)</button>`)}
R[0][1]=viewHome;
R.push(['/tai-khoan/bao-cao',reportView,'user']);
App.exportReport=()=>{const t=todayISO(),start=addDays(t,-6),logs=myLogs(me().id).filter(l=>l.date>=start&&l.date<=t);const lines=['Ngay,Can_nang_kg,Nuoc_ml,Giac_ngu_gio',...logs.map(l=>[l.date,l.weight||'',l.water||0,l.sleep||0].join(','))];const url=URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='fithealth-nhat-ky-tuan.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};

window.App=App;

/* ---------- init ---------- */
(async function init(){
  try{const s=lsGet(KEY);if(s)DB=JSON.parse(s)}catch(e){DB=null}
  if(!DB||!DB.users){DB=await seed();save()}
  sessionId=lsGet(SKEY);
  if(!me())sessionId=null;
  route();
})();
})();
</script>
